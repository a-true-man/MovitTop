# Movitop — weekly refresh of the Israeli transit data (GTFS -> optimized
# GTFS -> compiled MOTIS graph + per-line schedule DB), published as a
# downloadable Release asset with a small GitHub Pages status page.
#
# The MOTIS *engine* binary (app/src/main/jniLibs/*/libmotis.so) does not
# change here — only the routing graph *data* it reads, rebuilt from a
# fresh GTFS feed via `motis import`. See GITHUB_AUTOMATION.md for the
# full picture.
#
# Runs every Saturday at 19:00 Israel time. GitHub Actions cron is UTC-only
# and does not shift for Israel's DST, so two crons are scheduled (one for
# each UTC offset Israel uses across the year) and the job checks which of
# the two cron expressions actually fired (github.event.schedule) against
# the UTC offset Israel currently observes, so exactly one of the two
# firings runs, year-round — regardless of how late GitHub Actions
# actually dispatches the scheduled run (checking the wall-clock hour
# instead broke when a delayed dispatch landed outside the 19:00 hour).

name: Weekly transit data refresh

on:
  schedule:
    - cron: '0 16 * * 6'  # 19:00 Asia/Jerusalem during IDT (UTC+3, roughly Mar-Oct)
    - cron: '0 17 * * 6'  # 19:00 Asia/Jerusalem during IST (UTC+2, roughly Oct-Mar)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-transit-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Only run at the correct local time
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OFFSET="$(TZ=Asia/Jerusalem date +%z)"
            SCHEDULE="${{ github.event.schedule }}"
            if [ "${SCHEDULE}" = "0 16 * * 6" ] && [ "${OFFSET}" != "+0300" ]; then
              echo "Israel is at ${OFFSET}, not IDT (+0300) — this is the inactive DST cron slot. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [ "${SCHEDULE}" = "0 17 * * 6" ] && [ "${OFFSET}" != "+0200" ]; then
              echo "Israel is at ${OFFSET}, not IST (+0200) — this is the inactive DST cron slot. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install Python deps
        if: steps.check.outputs.skip != 'true'
        run: pip install --quiet pandas

      - name: Cache OSM extract (rarely changes; only GTFS is fetched fresh every run)
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: movitop_data/israel-and-palestine-latest.osm.pbf
          key: osm-pbf-v1

      - name: Fetch this week's GTFS feed
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p movitop_data
          curl -fL --retry 5 --retry-delay 5 \
            -o movitop_data/israel-public-transportation.zip \
            https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip

      - name: Fetch OSM extract (only if not restored from cache)
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ ! -f movitop_data/israel-and-palestine-latest.osm.pbf ]; then
            curl -fL --retry 5 --retry-delay 5 \
              -o movitop_data/israel-and-palestine-latest.osm.pbf \
              https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
          fi

      - name: Optimize GTFS
        if: steps.check.outputs.skip != 'true'
        run: python3 optimize_gtfs.py --data-dir movitop_data

      - name: Compile the MOTIS routing graph (motis import)
        if: steps.check.outputs.skip != 'true'
        run: ./compile_motis_graph.sh

      - name: Build the per-line schedule DB
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 build_line_schedules.py \
            --gtfs movitop_data/israel-optimized.zip \
            --output movitop_data/data/line_schedules.sqlite

      - name: Package
        if: steps.check.outputs.skip != 'true'
        id: package
        run: |
          BUILD_DATE="$(date +%Y-%m-%d)"
          ./package_motis_data.sh "movitop-data-latest.zip"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Publish as a rolling GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="transit-data-latest"
          TITLE="Transit data — ${{ steps.package.outputs.build_date }}"
          NOTES="Compiled MOTIS graph + line-schedule DB, rebuilt from the GTFS feed published on ${{ steps.package.outputs.build_date }}. Import movitop-data-latest.zip via the app's data-import screen."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" movitop-data-latest.zip --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" movitop-data-latest.zip --title "$TITLE" --notes "$NOTES"
          fi

      - name: Build the status page
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p public
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/transit-data-latest/movitop-data-latest.zip"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/transit-data-latest"
          sed -e "s#{{BUILD_DATE}}#${{ steps.package.outputs.build_date }}#g" \
              -e "s#{{DOWNLOAD_URL}}#${DOWNLOAD_URL}#g" \
              -e "s#{{RELEASE_URL}}#${RELEASE_URL}#g" \
              -e "s#{{REPO}}#${{ github.repository }}#g" \
              -e "s#{{PROJECT_URL}}#https://github.com/${{ github.repository }}#g" \
              github-pages/index.template.html > public/index.html

      - name: Deploy status page to GitHub Pages
        if: steps.check.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./public
          publish_branch: gh-pages
