# Cross-compile a Linux ARM64 MOTIS binary for on-device Android execution.
# Trigger manually from the GitHub Actions tab (workflow_dispatch).
#
# Runtime modules (routing, osr, geocoding) are selected via config.yml on the
# device — the executable is the full MOTIS server built with the upstream
# linux-arm64-release preset (musl, statically linked).

name: Build MOTIS ARM64 Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Official MOTIS cross-build image (ARM64 musl toolchain + pkg + cmake/ninja).
    # Equivalent to MOTIS CI; more reliable than dockcross for this project.
    container:
      image: ghcr.io/motis-project/docker-cpp-build

    steps:
      - name: Checkout MOTIS
        uses: actions/checkout@v4
        with:
          repository: motis-project/motis
          ref: c9bc040e8d55540911775f4a3b2adb60f945c8bf
          path: motis

      - name: Fetch dependencies (pkg)
        working-directory: motis
        run: |
          git config --global --add safe.directory "$(pwd)"
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global http.version HTTP/1.1
          /opt/pkg -l

      - name: Configure (linux-arm64-release)
        working-directory: motis
        run: cmake --preset linux-arm64-release

      - name: Build motis executable
        working-directory: motis
        run: cmake --build --preset linux-arm64-release --target motis -j "$(nproc)"

      - name: Strip and rename
        working-directory: motis
        run: |
          STRIP="/opt/aarch64-unknown-linux-musl/bin/strip"
          BIN="build/arm64-release/motis"
          test -f "${BIN}"
          "${STRIP}" "${BIN}"
          cp "${BIN}" motis-server
          chmod +x motis-server
          file motis-server
          ls -lh motis-server

      - name: Upload motis-server artifact
        uses: actions/upload-artifact@v4
        with:
          name: motis-server-arm64
          path: motis/motis-server
          retention-days: 30
